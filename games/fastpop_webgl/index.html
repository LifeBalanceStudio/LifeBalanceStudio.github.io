<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FastPop | 웹 데모</title>
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }

      body {
        height: 100vh;
        height: 100dvh;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #1F1F20;
      }

      #unity-canvas {
        display: block;
        width: min(100vw, calc(100vh * 600 / 960));
        width: min(100vw, calc(100dvh * 600 / 960));
        height: auto;
        aspect-ratio: 600 / 960;
      }

    </style>
  </head>
  <body>
    <canvas id="unity-canvas" width="600" height="960" tabindex="-1" aria-label="FastPop 게임 화면" style="background: #1F1F20"></canvas>
    <script src="Build/fastpop_webgl.loader.js"></script>
    <script>
      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/fastpop_webgl.data.unityweb",
        frameworkUrl: "Build/fastpop_webgl.framework.js.unityweb",
        codeUrl: "Build/fastpop_webgl.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "LifeBalance",
        productName: "FastPop",
        productVersion: "1.0.4",
        matchWebGLToCanvasSize: true,
      })
      .catch((message) => {
        alert("게임을 불러오지 못했습니다. 오류: " + message);
      });
    </script>
  </body>
</html>
